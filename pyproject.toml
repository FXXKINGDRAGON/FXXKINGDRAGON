[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxxkingdragon"
version = "0.1.0"
description = "A Python project scaffold."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "FXXKINGDRAGON" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
